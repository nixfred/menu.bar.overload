<svg xmlns="http://www.w3.org/2000/svg" width="960" height="230" viewBox="0 0 960 230" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">
  <rect width="960" height="230" fill="#0b0e17" rx="10"/>
  <text x="480" y="26" text-anchor="middle" fill="#cbd2e6" font-size="15">The strip is a ring. The viewport is a window onto it.</text>
  <!-- ring track -->
  <rect x="40" y="70" width="880" height="44" rx="22" fill="#111827" stroke="#2a3350"/>
  <!-- widgets on the ring -->
  <g font-size="12" fill="#0b0e17">
    <rect x="60" y="78" width="70" height="28" rx="6" fill="#5fd3c2"/><text x="95" y="97" text-anchor="middle">A</text>
    <rect x="140" y="78" width="110" height="28" rx="6" fill="#5fd3c2"/><text x="195" y="97" text-anchor="middle">B (wide)</text>
    <rect x="260" y="78" width="70" height="28" rx="6" fill="#5fd3c2"/><text x="295" y="97" text-anchor="middle">C</text>
    <rect x="340" y="78" width="70" height="28" rx="6" fill="#5fd3c2"/><text x="375" y="97" text-anchor="middle">D</text>
    <rect x="420" y="78" width="70" height="28" rx="6" fill="#89a0ff"/><text x="455" y="97" text-anchor="middle">E</text>
    <rect x="500" y="78" width="70" height="28" rx="6" fill="#89a0ff"/><text x="535" y="97" text-anchor="middle">F</text>
    <rect x="580" y="78" width="70" height="28" rx="6" fill="#89a0ff"/><text x="615" y="97" text-anchor="middle">G</text>
    <rect x="660" y="78" width="70" height="28" rx="6" fill="#89a0ff"/><text x="695" y="97" text-anchor="middle">H</text>
    <rect x="740" y="78" width="70" height="28" rx="6" fill="#89a0ff"/><text x="775" y="97" text-anchor="middle">I</text>
    <text x="865" y="97" text-anchor="middle" fill="#7f8ab0" font-size="11">seam</text>
  </g>
  <!-- viewport window -->
  <rect x="120" y="62" width="300" height="60" rx="8" fill="none" stroke="#ffcf6b" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="270" y="140" text-anchor="middle" fill="#ffcf6b">viewport: the room the center leaves</text>
  <!-- arrows -->
  <path d="M 470 150 L 250 150" stroke="#9aa4c2" stroke-width="2" marker-end="url(#a)"/>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9aa4c2"/></marker></defs>
  <text x="480" y="155" fill="#9aa4c2">wheel down / swipe right: widgets flow right to left</text>
  <g fill="#7f8ab0">
    <text x="480" y="186" text-anchor="middle">Every widget stays mounted; timers and services keep running off screen.</text>
    <text x="480" y="204" text-anchor="middle">Past I comes A again: the ring wraps, and the wrap always happens outside the viewport.</text>
  </g>
</svg>
