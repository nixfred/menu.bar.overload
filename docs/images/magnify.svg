<svg xmlns="http://www.w3.org/2000/svg" width="960" height="230" viewBox="0 0 960 230" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">
  <rect width="960" height="230" fill="#0b0e17" rx="10"/>
  <text x="480" y="26" text-anchor="middle" fill="#cbd2e6" font-size="15">Dock magnification: a cosine bump under the pointer, neighbours re-packed so nothing overlaps.</text>
  <!-- curve -->
  <path d="M 60 150 C 200 150 260 150 300 150 C 340 150 380 70 480 70 C 580 70 620 150 660 150 C 700 150 760 150 900 150" fill="none" stroke="#ffcf6b" stroke-width="2"/>
  <line x1="480" y1="60" x2="480" y2="185" stroke="#7f8ab0" stroke-dasharray="4 4"/>
  <text x="480" y="200" text-anchor="middle" fill="#9aa4c2">pointer</text>
  <line x1="300" y1="150" x2="660" y2="150" stroke="#2a3350"/>
  <text x="300" y="170" text-anchor="middle" fill="#7f8ab0">−radius</text>
  <text x="660" y="170" text-anchor="middle" fill="#7f8ab0">+radius</text>
  <text x="500" y="70" fill="#ffcf6b">×1.35</text>
  <text x="905" y="154" fill="#7f8ab0">×1.0</text>
  <!-- icons -->
  <g fill="#5fd3c2">
    <rect x="330" y="104" width="30" height="30" rx="6" opacity="0.7"/>
    <rect x="384" y="98" width="38" height="38" rx="7" opacity="0.85"/>
    <rect x="452" y="88" width="52" height="52" rx="9"/>
    <rect x="530" y="98" width="38" height="38" rx="7" opacity="0.85"/>
    <rect x="594" y="104" width="30" height="30" rx="6" opacity="0.7"/>
  </g>
  <text x="480" y="220" text-anchor="middle" fill="#7f8ab0">Icons also tilt a little around their vertical axis, away from the pointer, so the strip reads as a ring curving into the bar.</text>
</svg>
